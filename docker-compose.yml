services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-workforce-root-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workforce_hub}
      MYSQL_USER: ${MYSQL_USER:-workforce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workforce-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workforce-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-workforce-minio-change-me}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-workforce-minio}" "${MINIO_ROOT_PASSWORD:-workforce-minio-change-me}"; do sleep 2; done
        mc mb -p "local/${MINIO_BUCKET:-workforce-hub}"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-workforce_hub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-workforce}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-workforce-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-noreply@workforce-hub.local}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      WORKFORCE_AUTH_EMAIL_VERIFY_ENABLED: ${WORKFORCE_AUTH_EMAIL_VERIFY_ENABLED:-false}
      WORKFORCE_AUTH_REDIS_KEY_PREFIX: ${WORKFORCE_AUTH_REDIS_KEY_PREFIX:-workforce-hub:}
      WORKFORCE_PLUGIN_CONFIG_ENCRYPTION_KEY_BASE64: ${WORKFORCE_PLUGIN_CONFIG_ENCRYPTION_KEY_BASE64:-}
      WORKFORCE_PLUGIN_GATEWAY_CSRF_ALLOWED_ORIGINS: ${WORKFORCE_PLUGIN_GATEWAY_CSRF_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      WORKFORCE_FILE_STORAGE_PROVIDER: MINIO
      WORKFORCE_FILE_LOCAL_ROOT: /app/storage
      WORKFORCE_IM_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WORKFORCE_IM_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://localhost,http://127.0.0.1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio.localhost}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-workforce-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workforce-minio-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-workforce-hub}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "minio.localhost:host-gateway"
    volumes:
      - server-storage:/app/storage
      - server-plugins:/app/plugins
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
  server-storage:
  server-plugins:
