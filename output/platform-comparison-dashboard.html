<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业办公平台多维对比分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, rgba(30,30,60,0.8) 0%, transparent 100%);
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: #8892b0; font-size: 14px; }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            opacity: 0.5;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ccd6f6;
            margin-bottom: 4px;
        }
        .card-subtitle {
            font-size: 12px;
            color: #8892b0;
            margin-bottom: 20px;
        }
        .radar-container { grid-column: 1 / -1; }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        .heatmap-container { grid-column: 1 / -1; }
        
        /* 热力图样式 */
        .heatmap {
            width: 100%;
            border-collapse: separate;
            border-spacing: 3px;
        }
        .heatmap th {
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 500;
            color: #8892b0;
            text-align: center;
        }
        .heatmap th:first-child {
            text-align: right;
            padding-right: 16px;
            min-width: 120px;
        }
        .heatmap td {
            padding: 12px 8px;
            text-align: center;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s;
            cursor: default;
        }
        .heatmap td:hover {
            transform: scale(1.05);
        }
        .heatmap td:first-child {
            background: none !important;
            text-align: right;
            padding-right: 16px;
            font-size: 13px;
            font-weight: 500;
            color: #ccd6f6;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .legend-item:hover { background: rgba(255,255,255,0.05); }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .legend-text { font-size: 13px; }
        .insight-box {
            margin-top: 24px;
            padding: 20px;
            background: rgba(102,126,234,0.08);
            border: 1px solid rgba(102,126,234,0.2);
            border-radius: 12px;
        }
        .insight-box h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 12px;
        }
        .insight-box ul {
            list-style: none;
            padding: 0;
        }
        .insight-box li {
            font-size: 13px;
            color: #8892b0;
            padding: 4px 0;
            padding-left: 16px;
            position: relative;
        }
        .insight-box li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #667eea;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #8892b0;
            transition: all 0.2s;
        }
        .tab.active {
            background: rgba(102,126,234,0.2);
            border-color: #667eea;
            color: #667eea;
        }
        .tab:hover { background: rgba(255,255,255,0.08); }
        .parallel-container { grid-column: 1 / -1; }
        .parallel-svg { width: 100%; height: 350px; }
        
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>企业办公平台多维对比分析</h1>
        <p>飞书 · 钉钉 · 企业微信 · Microsoft Teams · Workforce Hub</p>
    </div>
    
    <div class="dashboard">
        <!-- 雷达图 -->
        <div class="card radar-container">
            <div class="card-title">能力雷达图</div>
            <div class="card-subtitle">六个核心维度的综合评估（满分 100）</div>
            <div class="chart-wrapper">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
        
        <!-- 平行坐标图 -->
        <div class="card parallel-container">
            <div class="card-title">平行坐标图</div>
            <div class="card-subtitle">多维度能力分布对比，拖拽轴线可筛选范围</div>
            <svg id="parallelChart" class="parallel-svg"></svg>
        </div>
        
        <!-- 热力图 -->
        <div class="card heatmap-container">
            <div class="card-title">能力热力图</div>
            <div class="card-subtitle">颜色深浅表示能力强弱，数值越大越强</div>
            <table class="heatmap" id="heatmapTable"></table>
        </div>
        
        <!-- 分析洞察 -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-title">定位分析</div>
            <div class="card-subtitle">基于数据的平台定位洞察</div>
            <div class="tabs">
                <div class="tab active" data-tab="workforce">Workforce Hub</div>
                <div class="tab" data-tab="feishu">飞书</div>
                <div class="tab" data-tab="dingtalk">钉钉</div>
                <div class="tab" data-tab="wecom">企业微信</div>
                <div class="tab" data-tab="teams">Teams</div>
            </div>
            <div class="insight-box" id="insightContent"></div>
        </div>
    </div>
    
    <script>
        // ========== 数据定义 ==========
        const labels = ['协同体验', '生态成熟度', 'AI智能化', '审批与流程', '私有化部署', '数据可控'];
        
        const platforms = {
            '飞书': { data: [92, 88, 82, 80, 40, 45], color: '#3370ff', colorRgb: '51,112,255' },
            '钉钉': { data: [85, 85, 75, 82, 35, 50], color: '#1677ff', colorRgb: '22,119,255' },
            '企业微信': { data: [82, 90, 68, 75, 45, 55], color: '#07c160', colorRgb: '7,193,96' },
            'Teams': { data: [88, 82, 80, 78, 42, 48], color: '#6264a7', colorRgb: '98,100,167' },
            'Workforce Hub': { data: [65, 55, 90, 82, 92, 90], color: '#ff6b6b', colorRgb: '255,107,107' }
        };
        
        const insights = {
            workforce: {
                title: 'Workforce Hub 差异化定位',
                points: [
                    'AI智能化得分 90，领先所有竞品，Agent 平台架构 + RAG 知识库 + DAG 工作流编排 + 审批预审',
                    '审批与流程 82 分，Flowable 引擎驱动 + Agent 预审节点自动校验 + 工具调用能力',
                    '私有化部署 92 分，Docker Compose 交付，数据全程不离开企业内网',
                    '数据可控 90 分，企业数据完全自主，无第三方云端依赖',
                    '核心优势：Agent 平台化（模型 + Prompt + 工具 + 知识库 + 触发器 + 权限 + 审计）而非对话助手'
                ]
            },
            feishu: {
                title: '飞书核心优势',
                points: [
                    '协同体验 92 分，产品打磨极致，文档和会议体验领先',
                    '生态成熟度 88 分，ISV 生态丰富，集成能力强',
                    'AI智能化 82 分，My AI 以对话助手形态提供服务',
                    '私有化部署 40 分，以 SaaS 为主，私有化成本高',
                    '定位：面向中大型企业的综合协同办公平台'
                ]
            },
            dingtalk: {
                title: '钉钉核心优势',
                points: [
                    '审批与流程 82 分，审批模板成熟，考勤硬件整合好',
                    '生态成熟度 85 分，市场渗透率高，ISV 生态庞大',
                    'AI智能化 75 分，AI 助理功能在持续迭代中',
                    '私有化部署 35 分，以 SaaS 模式为主',
                    '定位：面向全规模企业的通用协同平台'
                ]
            },
            wecom: {
                title: '企业微信核心优势',
                points: [
                    '生态成熟度 90 分，依托微信生态，客户触达能力独一无二',
                    '协同体验 82 分，与微信互通，用户习惯无门槛',
                    'AI智能化 68 分，AI 能力相对基础',
                    '数据可控 55 分，部分场景支持私有化',
                    '定位：有客户运营需求的微信生态企业'
                ]
            },
            teams: {
                title: 'Teams 核心优势',
                points: [
                    '协同体验 88 分，会议稳定，Office 365 整合深度高',
                    'AI智能化 80 分，Copilot 集成文档生成和会议摘要',
                    '生态成熟度 82 分，微软全球生态支撑',
                    '本地化不足，价格较高，人事功能缺失',
                    '定位：国际化企业的协同办公首选'
                ]
            }
        };
        
        // ========== 1. 雷达图 ==========
        const radarCtx = document.getElementById('radarChart').getContext('2d');
        new Chart(radarCtx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: Object.entries(platforms).map(([name, p]) => ({
                    label: name,
                    data: p.data,
                    borderColor: p.color,
                    backgroundColor: `rgba(${p.colorRgb},0.1)`,
                    borderWidth: 2,
                    pointBackgroundColor: p.color,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#8892b0', padding: 20, usePointStyle: true, pointStyle: 'circle' }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        titleColor: '#fff',
                        bodyColor: '#8892b0',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: true
                    }
                },
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 100,
                        ticks: { stepSize: 20, color: '#4a5568', backdropColor: 'transparent', font: { size: 10 } },
                        grid: { color: 'rgba(255,255,255,0.06)' },
                        angleLines: { color: 'rgba(255,255,255,0.06)' },
                        pointLabels: { color: '#8892b0', font: { size: 12 } }
                    }
                },
                interaction: { intersect: false }
            }
        });
        
        // ========== 2. 平行坐标图 ==========
        function drawParallelChart() {
            const svg = document.getElementById('parallelChart');
            const width = svg.clientWidth;
            const height = 350;
            const margin = { top: 40, right: 60, bottom: 30, left: 60 };
            const innerW = width - margin.left - margin.right;
            const innerH = height - margin.top - margin.bottom;
            
            svg.innerHTML = '';
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            
            const axisCount = labels.length;
            const axisSpacing = innerW / (axisCount - 1);
            
            // 绘制轴线
            labels.forEach((label, i) => {
                const x = margin.left + i * axisSpacing;
                
                // 轴线
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x); line.setAttribute('y1', margin.top);
                line.setAttribute('x2', x); line.setAttribute('y2', margin.top + innerH);
                line.setAttribute('stroke', 'rgba(255,255,255,0.15)');
                line.setAttribute('stroke-width', 1);
                svg.appendChild(line);
                
                // 轴标题
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x); text.setAttribute('y', margin.top - 12);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#8892b0');
                text.setAttribute('font-size', '11');
                text.textContent = label;
                svg.appendChild(text);
                
                // 刻度
                [0, 25, 50, 75, 100].forEach(val => {
                    const y = margin.top + innerH - (val / 100) * innerH;
                    const tick = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    tick.setAttribute('x', x - 8); tick.setAttribute('y', y + 3);
                    tick.setAttribute('text-anchor', 'end');
                    tick.setAttribute('fill', '#4a5568');
                    tick.setAttribute('font-size', '9');
                    tick.textContent = val;
                    svg.appendChild(tick);
                });
            });
            
            // 绘制数据线
            Object.entries(platforms).forEach(([name, p]) => {
                const points = p.data.map((val, i) => {
                    const x = margin.left + i * axisSpacing;
                    const y = margin.top + innerH - (val / 100) * innerH;
                    return `${x},${y}`;
                }).join(' ');
                
                const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                polyline.setAttribute('points', points);
                polyline.setAttribute('fill', 'none');
                polyline.setAttribute('stroke', p.color);
                polyline.setAttribute('stroke-width', 2);
                polyline.setAttribute('stroke-opacity', 0.7);
                polyline.style.cursor = 'pointer';
                polyline.style.transition = 'stroke-opacity 0.2s, stroke-width 0.2s';
                
                polyline.addEventListener('mouseenter', () => {
                    polyline.setAttribute('stroke-opacity', 1);
                    polyline.setAttribute('stroke-width', 3);
                });
                polyline.addEventListener('mouseleave', () => {
                    polyline.setAttribute('stroke-opacity', 0.7);
                    polyline.setAttribute('stroke-width', 2);
                });
                
                svg.appendChild(polyline);
                
                // 数据点
                p.data.forEach((val, i) => {
                    const x = margin.left + i * axisSpacing;
                    const y = margin.top + innerH - (val / 100) * innerH;
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x); circle.setAttribute('cy', y);
                    circle.setAttribute('r', 3);
                    circle.setAttribute('fill', p.color);
                    circle.setAttribute('stroke', '#0a0a1a');
                    circle.setAttribute('stroke-width', 1);
                    svg.appendChild(circle);
                });
            });
            
            // 图例
            const legendY = height - 8;
            let legendX = margin.left;
            Object.entries(platforms).forEach(([name, p]) => {
                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', legendX); dot.setAttribute('cy', legendY);
                dot.setAttribute('r', 4); dot.setAttribute('fill', p.color);
                svg.appendChild(dot);
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', legendX + 8); text.setAttribute('y', legendY + 4);
                text.setAttribute('fill', '#8892b0'); text.setAttribute('font-size', '11');
                text.textContent = name;
                svg.appendChild(text);
                
                legendX += name.length * 13 + 30;
            });
        }
        
        setTimeout(drawParallelChart, 100);
        window.addEventListener('resize', drawParallelChart);
        
        // ========== 3. 热力图 ==========
        function drawHeatmap() {
            const table = document.getElementById('heatmapTable');
            const platformNames = Object.keys(platforms);
            
            // 表头
            let headerHtml = '<thead><tr><th></th>';
            labels.forEach(l => headerHtml += `<th>${l}</th>`);
            headerHtml += '<th>均分</th></tr></thead>';
            
            // 表体
            let bodyHtml = '<tbody>';
            platformNames.forEach(name => {
                const p = platforms[name];
                const avg = Math.round(p.data.reduce((a, b) => a + b, 0) / p.data.length);
                bodyHtml += `<tr><td>${name}</td>`;
                p.data.forEach(val => {
                    const intensity = val / 100;
                    const bg = `rgba(${p.colorRgb}, ${intensity * 0.6 + 0.05})`;
                    const textColor = intensity > 0.5 ? '#fff' : '#8892b0';
                    bodyHtml += `<td style="background:${bg};color:${textColor}">${val}</td>`;
                });
                const avgBg = `rgba(${p.colorRgb}, 0.3)`;
                bodyHtml += `<td style="background:${avgBg};color:#fff;font-weight:700">${avg}</td>`;
                bodyHtml += '</tr>';
            });
            bodyHtml += '</tbody>';
            
            table.innerHTML = headerHtml + bodyHtml;
        }
        
        drawHeatmap();
        
        // ========== 4. 分析洞察 ==========
        function showInsight(tab) {
            const content = document.getElementById('insightContent');
            const insight = insights[tab];
            content.innerHTML = `
                <h3>${insight.title}</h3>
                <ul>${insight.points.map(p => `<li>${p}</li>`).join('')}</ul>
            `;
        }
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                showInsight(tab.dataset.tab);
            });
        });
        
        showInsight('workforce');
    </script>
</body>
</html>
