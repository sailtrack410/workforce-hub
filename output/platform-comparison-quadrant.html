<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办公平台四象限对比图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 40px;
            text-align: center;
        }
        .chart-container {
            position: relative;
            width: 800px;
            height: 800px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 40px;
        }
        .quadrant-bg {
            position: absolute;
            top: 80px;
            left: 80px;
            right: 80px;
            bottom: 80px;
        }
        .quadrant {
            position: absolute;
            width: 50%;
            height: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .quadrant.q1 { top: 0; left: 50%; background: rgba(46, 204, 113, 0.05); }
        .quadrant.q2 { top: 0; left: 0; background: rgba(52, 152, 219, 0.05); }
        .quadrant.q3 { bottom: 0; left: 0; background: rgba(241, 196, 15, 0.05); }
        .quadrant.q4 { bottom: 0; left: 50%; background: rgba(231, 76, 60, 0.05); }
        .axis-x, .axis-y {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }
        .axis-x {
            top: 50%;
            left: 80px;
            right: 80px;
            height: 1px;
        }
        .axis-y {
            left: 50%;
            top: 80px;
            bottom: 80px;
            width: 1px;
        }
        .axis-label {
            position: absolute;
            font-size: 12px;
            color: #8892b0;
        }
        .axis-label.x-left { bottom: 55px; left: 80px; }
        .axis-label.x-right { bottom: 55px; right: 80px; }
        .axis-label.y-top { top: 80px; left: 55px; transform: rotate(-90deg); transform-origin: left top; }
        .axis-label.y-bottom { bottom: 80px; left: 55px; transform: rotate(-90deg); transform-origin: left top; }
        .axis-title {
            position: absolute;
            font-size: 14px;
            color: #ccd6f6;
            font-weight: 500;
        }
        .axis-title.x { bottom: 30px; left: 50%; transform: translateX(-50%); }
        .axis-title.y { left: 15px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
        .platform {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .platform:hover {
            transform: scale(1.1);
        }
        .platform-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .platform-name {
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            max-width: 100px;
        }
        .platform-desc {
            font-size: 10px;
            color: #8892b0;
            text-align: center;
            max-width: 120px;
            margin-top: 4px;
        }
        .feishu .platform-icon { background: linear-gradient(135deg, #3370ff, #5b8ff9); }
        .dingtalk .platform-icon { background: linear-gradient(135deg, #1677ff, #4096ff); }
        .wecom .platform-icon { background: linear-gradient(135deg, #07c160, #2ecc71); }
        .teams .platform-icon { background: linear-gradient(135deg, #6264a7, #8b8dc4); }
        .workforce .platform-icon { background: linear-gradient(135deg, #ff6b6b, #ffa07a); }
        .legend {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .legend-text {
            font-size: 12px;
            color: #8892b0;
        }
        .quadrant-labels {
            position: absolute;
            top: 90px;
            left: 90px;
            right: 90px;
            bottom: 90px;
        }
        .q-label {
            position: absolute;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }
        .q-label.q1 { top: 10px; right: 10px; }
        .q-label.q2 { top: 10px; left: 10px; }
        .q-label.q3 { bottom: 10px; left: 10px; }
        .q-label.q4 { bottom: 10px; right: 10px; }
        .tooltip {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            z-index: 100;
            pointer-events: none;
        }
        .tooltip h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #fff;
        }
        .tooltip p {
            font-size: 11px;
            color: #8892b0;
            line-height: 1.6;
        }
        .tooltip .strength {
            color: #2ecc71;
        }
        .tooltip .weakness {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <h1>企业办公平台四象限定位对比</h1>
    <p class="subtitle">基于产品定位、核心能力、部署模式和目标客户的综合评估</p>
    
    <div class="chart-container">
        <div class="axis-title x">协同生态广度 →</div>
        <div class="axis-title y">← 数据自主可控</div>
        
        <div class="axis-x"></div>
        <div class="axis-y"></div>
        
        <div class="axis-label x-left">垂直深耕</div>
        <div class="axis-label x-right">生态广度</div>
        <div class="axis-label y-top">数据自主</div>
        <div class="axis-label y-bottom">云端托管</div>
        
        <div class="quadrant-bg">
            <div class="quadrant q1"></div>
            <div class="quadrant q2"></div>
            <div class="quadrant q3"></div>
            <div class="quadrant q4"></div>
        </div>
        
        <div class="quadrant-labels">
            <div class="q-label q1">理想区：生态广 + 数据自主</div>
            <div class="q-label q2">专精区：垂直深 + 数据自主</div>
            <div class="q-label q3">起步区：垂直深 + 云端</div>
            <div class="q-label q4">主流区：生态广 + 云端</div>
        </div>
        
        <!-- 飞书：右下象限（生态广，云端托管） -->
        <div class="platform feishu" style="right: 160px; bottom: 200px;" 
             data-name="飞书" 
             data-desc="字节跳动旗下，以极致的产品体验和丰富的协作工具链著称">
            <div class="platform-icon">飞</div>
            <div class="platform-name">飞书</div>
            <div class="platform-desc">体验领先，文档协作强</div>
        </div>
        
        <!-- 钉钉：右下象限偏中（生态广，云端，略偏左） -->
        <div class="platform dingtalk" style="right: 240px; bottom: 250px;"
             data-name="钉钉"
             data-desc="阿里系，市场渗透率高，审批流程成熟">
            <div class="platform-icon">钉</div>
            <div class="platform-name">钉钉</div>
            <div class="platform-desc">生态庞大，审批成熟</div>
        </div>
        
        <!-- 企微：右下象限（生态广，依托微信，云端） -->
        <div class="platform wecom" style="right: 180px; bottom: 300px;"
             data-name="企业微信"
             data-desc="依托微信生态，客户触达能力强">
            <div class="platform-icon">微</div>
            <div class="platform-name">企业微信</div>
            <div class="platform-desc">微信生态，客户触达</div>
        </div>
        
        <!-- Teams：右下象限（微软生态，国际化，云端） -->
        <div class="platform teams" style="right: 120px; bottom: 160px;"
             data-name="Microsoft Teams"
             data-desc="微软生态，国际化企业首选">
            <div class="platform-icon">T</div>
            <div class="platform-name">Teams</div>
            <div class="platform-desc">微软生态，国际化</div>
        </div>
        
        <!-- Workforce Hub：左上象限（垂直人事，私有化部署） -->
        <div class="platform workforce" style="left: 180px; top: 180px;"
             data-name="Workforce Hub"
             data-desc="智能人事协同平台，私有化部署，Agent深度嵌入业务">
            <div class="platform-icon">W</div>
            <div class="platform-name">Workforce Hub</div>
            <div class="platform-desc">人事深耕，私有化部署</div>
        </div>
        
        <div class="tooltip" id="tooltip"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #3370ff, #5b8ff9);"></div>
            <span class="legend-text">飞书</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #1677ff, #4096ff);"></div>
            <span class="legend-text">钉钉</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #07c160, #2ecc71);"></div>
            <span class="legend-text">企业微信</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #6264a7, #8b8dc4);"></div>
            <span class="legend-text">Teams</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #ff6b6b, #ffa07a);"></div>
            <span class="legend-text">Workforce Hub</span>
        </div>
    </div>
    
    <script>
        const platforms = document.querySelectorAll('.platform');
        const tooltip = document.getElementById('tooltip');
        
        const details = {
            '飞书': {
                strengths: ['产品体验极致', '文档协作能力强', '会议功能完善', 'OKR管理工具'],
                weaknesses: ['SaaS模式为主', '人事管理深度不足', '私有化成本高'],
                position: '协同生态广度高，数据托管在云端'
            },
            '钉钉': {
                strengths: ['市场渗透率高', '审批流程成熟', 'ISV生态丰富', '考勤硬件整合'],
                weaknesses: ['产品体验一般', '定制化成本高', '数据不在企业手中'],
                position: '协同生态广度高，数据托管在云端'
            },
            '企业微信': {
                strengths: ['微信生态打通', '客户触达能力强', '私域运营支持', '与微信互通'],
                weaknesses: ['内部协同能力弱', '人事功能基础', '依赖微信生态'],
                position: '依托微信生态，数据托管在云端'
            },
            'Microsoft Teams': {
                strengths: ['Office 365整合', '国际化支持好', '企业级安全', 'Teams会议稳定'],
                weaknesses: ['本地化不足', '价格较高', '人事功能缺失'],
                position: '微软生态，国际化企业首选'
            },
            'Workforce Hub': {
                strengths: ['私有化部署', 'Agent深度嵌入', '人事流程专业化', '数据完全自主'],
                weaknesses: ['生态成熟度低', '协同体验待打磨', '规模验证不足'],
                position: '垂直人事深耕，数据完全自主可控'
            }
        };
        
        platforms.forEach(platform => {
            platform.addEventListener('mouseenter', (e) => {
                const name = platform.dataset.name;
                const info = details[name];
                
                tooltip.innerHTML = `
                    <h3>${name}</h3>
                    <p><strong>定位：</strong>${info.position}</p>
                    <p class="strength"><strong>优势：</strong>${info.strengths.join('、')}</p>
                    <p class="weakness"><strong>不足：</strong>${info.weaknesses.join('、')}</p>
                `;
                
                const rect = platform.getBoundingClientRect();
                const containerRect = platform.parentElement.getBoundingClientRect();
                
                tooltip.style.display = 'block';
                tooltip.style.left = (rect.left - containerRect.left + 70) + 'px';
                tooltip.style.top = (rect.top - containerRect.top) + 'px';
            });
            
            platform.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });
        });
    </script>
</body>
</html>
