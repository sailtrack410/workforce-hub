server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: workforce-hub

  # ==================== Profile ====================
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:api}

  # ==================== MySQL (主业务库) ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 这里显式使用 Java 侧 UTF-8 编码名，并通过连接排序规则固定到 MySQL utf8mb4。
    # 避免 Connector/J 把 utf8mb4 当成 Java Charset 名称解析，导致启动阶段直接报错。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workforce_hub}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ==================== Session ====================
  session:
    store-type: redis
    timeout: 7200
    redis:
      namespace: workforce:session

  # ==================== Flyway ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history

  # ==================== Mail (SMTP) ====================
  # 第一版用于邮箱验证码、绑定邮箱、找回密码
  # 开发环境可指向本地 MailHog/Mailpit；生产环境需配置真实 SMTP
  # 本地测试示例：127.0.0.1:1025 + auth/starttls/ssl 全部 false
  # 使用 127.0.0.1 而不是 localhost，避免本机 IPv4/IPv6 解析差异导致调试 SMTP 偶发连不上
  # 网易 163 示例：smtp.163.com:465 + auth=true + ssl.enable=true
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@workforce-hub.local}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== Flowable ====================
# Flowable BPMN 引擎表（ACT_* / FLW_*）已通过 Flyway V11 纳入主库迁移。
# 默认禁止 Flowable 自动改库，避免绕过 Flyway 造成环境结构漂移。
# 仅在临时本地诊断旧库结构时，才允许显式设置 FLOWABLE_DB_SCHEMA_UPDATE=true。
flowable:
  database-schema-update: ${FLOWABLE_DB_SCHEMA_UPDATE:false}
  async-executor-activate: true
  history-level: audit

# ==================== Workforce Hub 业务配置 ====================
workforce:
  im:
    websocket:
      allowed-origin-patterns: ${IM_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
    outbox:
      dispatcher:
        enabled: ${IM_OUTBOX_DISPATCHER_ENABLED:true}
        batch-size: ${IM_OUTBOX_DISPATCHER_BATCH_SIZE:100}
        max-attempts: ${IM_OUTBOX_DISPATCHER_MAX_ATTEMPTS:5}
        retry-delay-ms: ${IM_OUTBOX_DISPATCHER_RETRY_DELAY_MS:5000}
        sending-stale-ms: ${IM_OUTBOX_DISPATCHER_SENDING_STALE_MS:60000}
        fixed-delay-ms: ${IM_OUTBOX_DISPATCHER_FIXED_DELAY_MS:3000}
        initial-delay-ms: ${IM_OUTBOX_DISPATCHER_INITIAL_DELAY_MS:3000}
  agent:
    model:
      enabled: ${AGENT_MODEL_ENABLED:false}
      base-url: ${AGENT_MODEL_BASE_URL:}
      api-key: ${AGENT_MODEL_API_KEY:}
      model: ${AGENT_MODEL_NAME:}
      timeout: ${AGENT_MODEL_TIMEOUT:30s}
      max-tokens: ${AGENT_MODEL_MAX_TOKENS:1024}
      temperature: ${AGENT_MODEL_TEMPERATURE:0.2}
    timeout-scan:
      enabled: ${AGENT_TIMEOUT_SCAN_ENABLED:true}
      batch-size: ${AGENT_TIMEOUT_SCAN_BATCH_SIZE:100}
      fixed-delay-ms: ${AGENT_TIMEOUT_SCAN_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${AGENT_TIMEOUT_SCAN_INITIAL_DELAY_MS:60000}

# ==================== MinIO ====================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:workforce-hub}

# ==================== Logging ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # 邮件属于当前阶段的可选能力，本地未接 SMTP 时不应拖垮整体健康状态。
    # 需要把邮件也纳入部署探活时，可通过环境变量重新开启。
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    com.workforcehub: debug
    org.flowable: info

---
# ==================== API Profile ====================
spring:
  config:
    activate:
      on-profile: api

---
# ==================== Worker Profile ====================
spring:
  config:
    activate:
      on-profile: worker

# Worker 不需要暴露 HTTP 端口，但 Spring Boot 需要一个端口启动
server:
  port: 8081
