<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>99-4 受控 API 浏览器验证</title>
  <style>
    :root { --bg: #f3f5f8; --panel: #fff; --text: #172336; --muted: #53647a; --line: #dce3ec; --accent: #186f54; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 960px; margin: 36px auto; } header { margin-bottom: 24px; } small { color: var(--muted); letter-spacing: .04em; } h1 { margin: 8px 0; font-size: 30px; } p { color: var(--muted); margin: 6px 0; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; padding: 20px 26px; } h2 { font-size: 18px; margin: 0 0 16px; }
    label { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 20px; margin: 14px 0; } input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; } output { color: var(--accent); font-weight: 700; font-size: 24px; }
    dl { display: grid; grid-template-columns: 150px 1fr; gap: 10px 20px; margin: 0; } dt { color: var(--muted); } dd { margin: 0; color: var(--accent); font-weight: 600; } code, pre { font-size: 14px; } pre { margin: 12px 0; color: var(--muted); }
  </style>
</head>
<body><div id="app"></div><script src="bundle.js"></script></body>
</html>
